<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style/login.css" rel="stylesheet" />
    <title>CoffeeChampions</title>
  </head>

  <body>
    <main>
      <div id="box-login">
        
        <section id="section-logo">
          <div class="box-logo">
            <div class="logo-icon">
                <img src="assets/cappucinoHome.jpg" alt="americano" />
            </div>
            <h1>CoffeeChampions</h1>
            <p>little things can make the biggest difference...</p>
          </div>
        </section>

        
        <section id="section-form">
          <div class="form-content">
            <h2>Welcome Back!</h2>
            <p class="form-description">
              Login to continue your coffee journey.
            </p>

            <form action="#" method="post">
              <div class="form-group">
                <label for="username">Username</label>
                <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Enter your username"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                />
              </div>

              <button type="submit" id="button-login">Login</button>
            </form>

            <p class="register-text">
              Don't have an account?
              <a href="signUp.html">Register</a>
            </p>

            <a href="index.html" class="back-home">Back to Home </a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
